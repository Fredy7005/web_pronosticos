name: Actualizar Ligas con Doble Clave

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Descargar datos de The Odds API con Respaldo Dual
        env:
          KEY_1: ${{ secrets.ODDS_API_KEY1 }}
          KEY_2: ${{ secrets.ODDS_API_KEY2 }}
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          console.log("🔍 Diagnóstico de Claves:");
          console.log("KEY_1 existe:", !!process.env.KEY_1, "Longitud:", process.env.KEY_1 ? process.env.KEY_1.length : 0);
          console.log("KEY_2 existe:", !!process.env.KEY_2, "Longitud:", process.env.KEY_2 ? process.env.KEY_2.length : 0);

          const keys = [process.env.KEY_1, process.env.KEY_2].filter(Boolean);
          if (keys.length === 0) {
            console.error("❌ ERROR CRÍTICO: No hay ninguna clave disponible en las variables de entorno.");
            process.exit(1);
          }

          const LIGAS_MAP = {
            "PD": "soccer_spain_la_liga",
            "SD": "soccer_spain_segunda_division",
            "PL": "soccer_epl",
            "CL": "soccer_uefa_champs_league",
            "SA": "soccer_italy_serie_a",
            "BL": "soccer_germany_bundesliga",
            "L1": "soccer_france_ligue_one",
            "EL": "soccer_uefa_europa_league",
            "ECL": "soccer_uefa_europa_conference_league",
            "ED": "soccer_netherlands_eredivisie",
            "PPL": "soccer_portugal_primeira_liga",
            "ELC": "soccer_efl_champ",
            "MLS": "soccer_usa_mls",
            "BR": "soccer_brazil_campeonato",
            "MX": "soccer_mexico_ligamx",
            "ARG": "soccer_argentina_primera_division",
            "BEL": "soccer_belgium_first_div",
            "TUR": "soccer_turkey_super_league",
            "COL": "soccer_colombia_primera_a",
            "URU": "soccer_uruguay_primera_division",
            "JPN": "soccer_japan_j_league",
            "KOR": "soccer_korea_kleague1",
            "AUS": "soccer_australia_aleague"
          };

          function peticionConClave(sportKey, keyIndex) {
            return new Promise((resolve, reject) => {
              if (keyIndex >= keys.length) {
                reject(new Error("Agotadas todas las claves"));
                return;
              }
              const apiKey = keys[keyIndex];
              const options = {
                hostname: "api.the-odds-api.com",
                path: `/v4/sports/${sportKey}/odds?apiKey=${apiKey}&regions=eu&markets=h2h,totals&oddsFormat=decimal`,
                method: "GET"
              };

              https.get(options, (res) => {
                let data = "";
                res.on("data", (chunk) => { data += chunk; });
                res.on("end", () => {
                  if (res.statusCode === 200) {
                    try {
                      const json = JSON.parse(data);
                      resolve({ json, keyUsada: keyIndex + 1 });
                    } catch (e) {
                      reject(new Error("Error parseando JSON"));
                    }
                  } else {
                    console.warn(`⚠️ Clave #${keyIndex + 1} falló para ${sportKey} (HTTP ${res.statusCode}). Probando siguiente clave...`);
                    peticionConClave(sportKey, keyIndex + 1).then(resolve).catch(reject);
                  }
                });
              }).on("error", () => {
                peticionConClave(sportKey, keyIndex + 1).then(resolve).catch(reject);
              });
            });
          }

          async function run() {
            const resultadosLigas = {};
            for (const [codigo, sportKey] of Object.entries(LIGAS_MAP)) {
              try {
                const resultado = await peticionConClave(sportKey, 0);
                resultadosLigas[codigo] = resultado.json;
                console.log(`✅ ${sportKey}: ${resultado.json.length} partidos encontrados (Clave #${resultado.keyUsada})`);
              } catch (e) {
                console.warn(`❌ No se pudo descargar ${sportKey} con ninguna clave.`);
                resultadosLigas[codigo] = [];
              }
              await new Promise(r => setTimeout(r, 300));
            }

            const payload = {
              actualizacion: new Date().toISOString(),
              ligas: resultadosLigas
            };

            fs.writeFileSync("datos-ligas.json", JSON.stringify(payload, null, 2));
            console.log("📁 Archivo datos-ligas.json generado con éxito.");
          }

          run();
          '

      - name: Subir cambios al repositorio
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add datos-ligas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Diagnóstico de claves en Actions" && git push)
