name: Actualizar Datos de Fútbol

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta automáticamente cada 6 horas
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Descargar partidos y estadísticas desde API-Football
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          # Aquí haremos la petición a la API y guardaremos el resultado en un archivo JSON local
          curl --request GET \
            --url 'https://v3.football.api-sports.io/fixtures?live=all' \
            --header "x-apisports-key: $API_KEY" > partidos.json

      - name: Subir cambios al repositorio
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add partidos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de partidos y estadísticas" && git push)
