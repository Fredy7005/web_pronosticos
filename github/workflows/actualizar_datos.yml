name: Actualizar Ligas con Doble Clave

on:
  schedule:
    - cron: '0 */6 * * *' # Cada 6 horas
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Descargar datos de The Odds API
        env:
          KEY_1: ${{ secrets.ODDS_API_KEY1 }}
          KEY_2: ${{ secrets.ODDS_API_KEY2 }}
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          // Seleccionamos la clave según la quincena del mes (estrategia inteligente)
          const diaActual = new Date().getDate();
          const apiKeyActiva = (diaActual <= 15 ? process.env.KEY_1 : process.env.KEY_2) || process.env.KEY_1;

          if (!apiKeyActiva) {
            console.error("❌ No se encontró ninguna clave válida en los Secrets.");
            process.exit(1);
          }

          console.log(`🔑 Usando clave correspondiente a la quincena (Día ${diaActual})...`);

          const LIGAS_MAP = {
            "PD": "soccer_spain_la_liga",
            "SD": "soccer_spain_segunda_division",
            "PL": "soccer_epl",
            "CL": "soccer_uefa_champs_league",
            "SA": "soccer_italy_serie_a",
            "BL": "soccer_germany_bundesliga",
            "L1": "soccer_france_ligue_one",
            "EL": "soccer_uefa_europa_league",
            "ECL": "soccer_uefa_europa_conference_league",
            "ED": "soccer_netherlands_eredivisie",
            "PPL": "soccer_portugal_primeira_liga",
            "ELC": "soccer_efl_champ",
            "MLS": "soccer_usa_mls",
            "BR": "soccer_brazil_campeonato",
            "MX": "soccer_mexico_ligamx",
            "ARG": "soccer_argentina_primera_division",
            "BEL": "soccer_belgium_first_div",
            "TUR": "soccer_turkey_super_league",
            "COL": "soccer_colombia_primera_a",
            "URU": "soccer_uruguay_primera_division",
            "JPN": "soccer_japan_j_league",
            "KOR": "soccer_korea_kleague1",
            "AUS": "soccer_australia_aleague"
          };

          function peticion(sportKey) {
            return new Promise((resolve) => {
              const options = {
                hostname: "api.the-odds-api.com",
                path: `/v4/sports/${sportKey}/odds?apiKey=${apiKeyActiva}&regions=eu&markets=h2h,totals&oddsFormat=decimal`,
                method: "GET"
              };

              https.get(options, (res) => {
                let data = "";
                res.on("data", (chunk) => { data += chunk; });
                res.on("end", () => {
                  if (res.statusCode === 200) {
                    try {
                      const json = JSON.parse(data);
                      console.log(`✅ ${sportKey}: ${json.length} partidos encontrados.`);
                      resolve(json);
                    } catch (e) {
                      console.warn(`⚠️ Error parseando ${sportKey}`);
                      resolve([]);
                    }
                  } else {
                    console.warn(`⚠️ ${sportKey} devolvió estado HTTP ${res.statusCode}`);
                    resolve([]);
                  }
                });
              }).on("error", () => {
                console.warn(`⚠️ Error de red en ${sportKey}`);
                resolve([]);
              });
            });
          }

          async function run() {
            const resultadosLigas = {};
            for (const [codigo, sportKey] of Object.entries(LIGAS_MAP)) {
              resultadosLigas[codigo] = await peticion(sportKey);
              await new Promise(r => setTimeout(r, 300)); // Pausa breve para evitar bloqueo por velocidad
            }

            const payload = {
              actualizacion: new Date().toISOString(),
              ligas: resultadosLigas
            };

            fs.writeFileSync("datos-ligas.json", JSON.stringify(payload, null, 2));
            console.log("📁 Archivo datos-ligas.json actualizado correctamente.");
          }

          run();
          '

      - name: Subir cambios al repositorio
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add datos-ligas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización con doble clave por quincenas" && git push)
