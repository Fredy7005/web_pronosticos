name: Actualizar Partidos y Mercados

on:
  schedule:
    - cron: '0 */6 * * *' # Cada 6 horas
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Descargar partidos y mercados desde API-Football
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          # Descargamos los partidos del día y sus mercados principales de cuotas
          curl --request GET \
            --url 'https://v3.football.api-sports.io/odds?season=2026&bookmaker=6' \
            --header "x-apisports-key: $API_KEY" > partidos.json

      - name: Subir cambios al repositorio
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add partidos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de mercados y cuotas" && git push)
