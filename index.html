<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportPredicts - Pronósticos Inteligentes</title>
    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- Cabecera -->
    <header class="w-full max-w-5xl flex flex-col sm:flex-row justify-between items-center my-6 gap-4">
        <div>
            <div class="flex items-center gap-3">
                <span class="text-3xl">⚽</span>
                <h1 class="text-3xl font-extrabold tracking-tight text-emerald-400">SportPredicts</h1>
            </div>
            <p class="text-slate-400 text-xs sm:text-sm mt-1">Pronósticos directos, goles, ambos marcan y córners inteligentes</p>
        </div>
        <div class="flex items-center flex-wrap gap-2.5">
            <!-- Botón de Historial -->
            <button id="btn-vista-historial" onclick="toggleVistaHistorial()" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 text-xs font-bold px-4 py-2.5 rounded-xl transition shadow flex items-center gap-2">
                📜 Ver Historial
            </button>
            
            <!-- Botones de Autenticación por defecto (se gestionan dinámicamente desde app.js) -->
            <button id="btn-login-header" onclick="abrirModalAuth('login')" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 text-xs font-bold px-3.5 py-2.5 rounded-xl transition shadow flex items-center gap-1.5">
                🔑 Iniciar Sesión
            </button>
            <button id="btn-registro-header" onclick="abrirModalAuth('registro')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition shadow flex items-center gap-1.5">
                📝 Registrarse
            </button>

            <span class="bg-slate-900 text-xs px-3 py-1.5 rounded-full text-slate-300 border border-slate-800 font-bold">+18</span>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="w-full max-w-5xl flex flex-col gap-5">

        <!-- Panel Superior: Ligas y Controles -->
        <section id="panel-controles" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl flex flex-col lg:flex-row justify-between gap-5">
            
            <!-- Botones de las 23 Competiciones -->
            <div class="flex-1">
                <h2 id="titulo-seccion-ligas" class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-3">Selecciona una Competición</h2>
                <div id="ligas-container" class="flex flex-wrap gap-2">
                    <button id="btn-PD" onclick="cambiarLiga('PD')" class="liga-btn bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition shadow">La Liga</button>
                    <button id="btn-SD" onclick="cambiarLiga('SD')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Segunda División</button>
                    <button id="btn-PL" onclick="cambiarLiga('PL')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Premier League</button>
                    <button id="btn-CL" onclick="cambiarLiga('CL')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Champions</button>
                    <button id="btn-SA" onclick="cambiarLiga('SA')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Serie A</button>
                    <button id="btn-BL" onclick="cambiarLiga('BL')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Bundesliga</button>
                    <button id="btn-L1" onclick="cambiarLiga('L1')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Ligue 1</button>
                    <button id="btn-EL" onclick="cambiarLiga('EL')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Europa League</button>
                    <button id="btn-ECL" onclick="cambiarLiga('ECL')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Conference League</button>
                    <button id="btn-ED" onclick="cambiarLiga('ED')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Eredivisie</button>
                    <button id="btn-PPL" onclick="cambiarLiga('PPL')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Primeira Liga</button>
                    <button id="btn-ELC" onclick="cambiarLiga('ELC')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Championship</button>
                    <button id="btn-MLS" onclick="cambiarLiga('MLS')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">MLS</button>
                    <button id="btn-BR" onclick="cambiarLiga('BR')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Brasileirão</button>
                    <button id="btn-MX" onclick="cambiarLiga('MX')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Liga MX</button>
                    <button id="btn-ARG" onclick="cambiarLiga('ARG')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Argentina</button>
                    <button id="btn-BEL" onclick="cambiarLiga('BEL')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Jupiler Pro League</button>
                    <button id="btn-TUR" onclick="cambiarLiga('TUR')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Süper Lig</button>
                    <button id="btn-COL" onclick="cambiarLiga('COL')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Copa Libertadores</button>
                    <button id="btn-URU" onclick="cambiarLiga('URU')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">Primera División (Chile)</button>
                    <button id="btn-JPN" onclick="cambiarLiga('JPN')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">J1 League (Japón)</button>
                    <button id="btn-KOR" onclick="cambiarLiga('KOR')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">K League 1 (Corea del Sur)</button>
                    <button id="btn-AUS" onclick="cambiarLiga('AUS')" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold transition">A-League (Australia)</button>
                </div>
            </div>

            <!-- Controles laterales -->
            <div id="controles-derecha" class="flex flex-col gap-2.5 min-w-[210px] justify-center border-t lg:border-t-0 lg:border-l border-slate-800 pt-4 lg:pt-0 lg:pl-5">
                <select id="select-orden" onchange="cambiarOrden()" class="bg-slate-800/90 border border-slate-700/80 text-xs text-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-emerald-500">
                    <option value="fecha">📅 Ordenar por Fecha</option>
                    <option value="probabilidad">🎯 Ordenar por Probabilidad</option>
                </select>

                <button id="btn-solo-valor" onclick="toggleSoloValor()" aria-pressed="false" class="bg-slate-800/90 border border-slate-700/80 text-slate-300 hover:bg-slate-700 text-xs font-semibold px-3 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5">
                    💎 Oportunidades Top
                </button>

                <div class="flex items-center justify-between bg-slate-800/90 border border-slate-700/80 rounded-xl px-3 py-1.5">
                    <span class="text-xs text-slate-400">Apostar:</span>
                    <input type="number" id="input-stake" value="10" min="1" max="10000" oninput="actualizarSimulacion()" class="w-16 bg-slate-950 border border-slate-700 text-xs text-center text-white font-bold rounded-lg py-1 outline-none focus:border-emerald-500">
                    <span class="text-xs text-slate-400">€</span>
                </div>
            </div>
        </section>

        <!-- Barra de Estado -->
        <div id="estado" class="text-xs text-slate-400 px-1">
            Sincronizando pronósticos...
        </div>

        <!-- Contenedor de Partidos -->
        <div id="partidos-container" class="flex flex-col gap-4 pb-12"></div>

    </main>

    <!-- Modal de Detalle de Partido -->
    <div id="modal-detalle" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-center items-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 relative shadow-2xl">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold">✕</button>
            <div id="modal-contenido"></div>
        </div>
    </div>

    <!-- Modal de Autenticación -->
    <div id="modal-auth" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-center items-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 relative shadow-2xl">
            <button onclick="cerrarModalAuth()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold">✕</button>
            
            <div class="flex border-b border-slate-800 mb-5">
                <button id="tab-login" onclick="cambiarTabAuth('login')" class="flex-1 pb-3 text-xs font-bold text-emerald-400 border-b-2 border-emerald-500 transition">🔑 Iniciar Sesión</button>
                <button id="tab-registro" onclick="cambiarTabAuth('registro')" class="flex-1 pb-3 text-xs font-semibold text-slate-400 border-b-2 border-transparent transition">📝 Registrarse</button>
            </div>

            <div id="auth-contenido"></div>
        </div>
    </div>

    <script src="app.js?v=8"></script>
</body>
</html>
