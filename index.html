<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportPredicts - Pronósticos & Cuotas en Vivo</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen p-3 sm:p-6 md:p-8 pb-16">
  <div class="max-w-5xl mx-auto">
    
    <!-- Encabezado Principal -->
    <header class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6 border-b border-slate-700/60 pb-6">
      <div class="text-center sm:text-left">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-gradient flex items-center justify-center sm:justify-start gap-2">⚽ SportPredicts</h1>
        <p class="text-xs text-slate-400 mt-1">Pronósticos inteligentes y análisis de cuotas en tiempo real</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="bg-green-500/10 text-green-400 text-xs font-semibold px-3 py-1.5 rounded-full border border-green-500/20 badge-glow flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Odds API En Vivo
        </span>
      </div>
    </header>

    <!-- Panel de Control y Filtros -->
    <div class="card-glass p-4 rounded-2xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
      
      <!-- Selector de Ligas -->
      <div class="flex flex-wrap justify-center sm:justify-start gap-2 w-full md:w-auto">
        <button onclick="cambiarLiga('PD')" id="btn-PD" class="liga-btn btn-primary text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition active:scale-95">La Liga</button>
        <button onclick="cambiarLiga('PL')" id="btn-PL" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3.5 py-2.5 rounded-xl border border-slate-700/60 transition active:scale-95">Premier League</button>
        <button onclick="cambiarLiga('CL')" id="btn-CL" class="liga-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3.5 py-2.5 rounded-xl border border-slate-700/60 transition active:scale-95">Champions League</button>
      </div>

      <!-- Filtro de Confianza & Calculadora de Apuesta -->
      <div class="flex flex-wrap items-center justify-between sm:justify-end gap-3 w-full md:w-auto">
        
        <!-- Toggle Solo Top Picks -->
        <button onclick="toggleTopPicks()" id="btn-top-picks" class="bg-slate-800/90 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3.5 py-2.5 rounded-xl border border-slate-700/80 flex items-center gap-2 transition active:scale-95">
          🔥 Solo Top Picks
        </button>

        <!-- Calculadora de Apuestas -->
        <div class="flex items-center gap-2 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-slate-700/80">
          <label for="input-stake" class="text-[11px] text-slate-400 font-semibold">Simular Apostar:</label>
          <input type="number" id="input-stake" value="10" min="1" max="1000" onchange="actualizarSimulacion()" oninput="actualizarSimulacion()" class="w-14 bg-slate-800 border border-slate-600 text-center text-xs font-bold text-green-400 rounded-lg py-1 focus:outline-none focus:border-green-400">
          <span class="text-xs text-slate-400 font-bold">€</span>
        </div>

      </div>

    </div>

    <!-- Contenedor Principal de Partidos -->
    <div id="partidos-container" class="grid gap-4">
      <p class="text-slate-400 text-center py-16 text-sm">Cargando próximos partidos y analizando cuotas...</p>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
